name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Tests et ZIP Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Executer les tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Construire l'application
        shell: pwsh
        run: .\build.ps1 -SkipInstall

      - name: Creer le ZIP et son empreinte SHA-256
        shell: pwsh
        run: |
          $zip = "dist\AutocalsolTools-Windows-x64.zip"
          Compress-Archive -Path "dist\AutocalsolTools\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  AutocalsolTools-Windows-x64.zip" | Set-Content "dist\AutocalsolTools-Windows-x64.sha256.txt" -Encoding ascii

      - name: Publier l'artefact telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: AutocalsolTools-Windows-x64
          path: |
            dist/AutocalsolTools-Windows-x64.zip
            dist/AutocalsolTools-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publier la GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist\AutocalsolTools-Windows-x64.zip",
            "dist\AutocalsolTools-Windows-x64.sha256.txt"
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --generate-notes --title "Autocalsol Tools $tag"
          }

